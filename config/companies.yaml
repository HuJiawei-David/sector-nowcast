# Company universe. Adding a company = adding an entry here (hard rule 10).
# All quarters are calendar quarters ("YYYYQn"). Windows are inclusive.
# Frozen at the `prereg` tag together with docs/hypotheses.md.

defaults:
  fiscal_year_end: "12-31"            # all seven names report on calendar quarters
  wikipedia:
    project: en.wikipedia             # English Wikipedia only
    access: all-access
    agent: user                       # exclude spiders/automated agents
    titles_checked_since: "2019-01-01"
    move_check: "data/raw/wikipedia_meta/2026-11-10/ (revision-history move edits + move log)"
    combine: sum                      # one series per name = daily sum over all listed articles and all their titles

companies:
  BKNG:
    name: Booking Holdings Inc.
    cik: 1075531
    region: US
    revenue:
      source: xbrl                    # SEC companyfacts, us-gaap
      xbrl_tags: [Revenues]           # first tag with a fact for the period wins
      currency: USD
    kpi:
      name: Room nights
      unit: millions
      source: earnings press release (8-K Item 2.02, Ex-99.1)
    wikipedia_articles:
      - current_title: Booking Holdings
        titles_since_2019: [Booking Holdings]
      - current_title: Booking.com
        titles_since_2019: [Booking.com]
    volume_source: tsa
    exclusion_window: [2020Q1, 2021Q4]
    headline_window: [2023Q2, 2026Q3]
    robustness_window: [2024Q1, 2026Q3]

