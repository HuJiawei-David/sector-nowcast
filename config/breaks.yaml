# Structural breaks a demand proxy cannot see (CLAUDE.md "STRUCTURAL BREAKS"; docs/drivers.md).
# Frozen at the `prereg` tag. Scope: events whose effect on YoY growth falls in 2022Q1-2026Q3.
#
# affected_yoy_quarters = quarters q whose YoY value (y_q and/or k_q, per `targets`) is mechanically
# shifted by the event. Rules used to derive them (applied by hand, checked by tests/test_config.py):
#   acquisition / disposal / accounting-model change effective on date D in quarter c:
#       c .. c+4  (c+4 because its base quarter c holds only part of the event),
#       or c .. c+3 when D falls in the first 7 days of quarter c (base c+4 then holds ~all of it).
#   one-off revenue item booked in quarter q: q and q+4 (base effect one year later).
#   explicit: quarters named by the company's own filings (rule = "explicit").
# materiality (docs/hypotheses.md section 3.8), assigned by this rule only:
#   MAJOR if (a) type is accounting_model_change, one_off_revenue, kpi_definition or
#   business_practice_change; or (b) the company quantifies the event's effect on revenue, the KPI
#   or growth in a filing or earnings release, or reports a figure "excluding" it; otherwise MINOR.
#   For (b), materiality_quote is the justifying sentence, verbatim from materiality_source (saved
#   under data/raw/sec_filings/; checked by tests/test_config.py).
# Robustness (pre-registered): a direction call for target quarter q is dropped if y_q or y_{q-1}
# (k_q or k_{q-1} for the KPI target) is listed in a MAJOR break for that name and target.
# MINOR breaks stay listed but are not dropped.
# `clean_only_note`: true when every listed quarter is already outside the clean set (hard rule 4),
# i.e. listed for completeness only.

breaks:
  - name: BKNG
    event: Acquisition of Getaroom (B2B hotel distributor) completed December 2021
    type: acquisition
    effective: "2021-12"
    targets: [y]
    affected_yoy_quarters: [2021Q4, 2022Q1, 2022Q2, 2022Q3, 2022Q4]
    rule: c..c+4
    materiality: minor
    materiality_basis: "neither (a) nor (b): no company-quantified effect on revenue, KPI or growth and no 'excluding' figure found (EDGAR full-text search for the acquiree's name, 8-K/10-Q/10-K, scripts/s1b_materiality_search.py)"
    clean_only_note: true
    source: https://www.sec.gov/Archives/edgar/data/1075531/000107553122000008/bkng-20211231.htm
  - name: BKNG
    event: "FTC matter: $900 million reduction in revenue recorded in Q3 2026 (excluded from Adjusted Revenue); GAAP revenue -1% Y/Y vs Adjusted Revenue +9%"
